      <rect x="390" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="405" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="420" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="435" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="450" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="465" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="480" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="495" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
    </g>
    

    <!-- VS Divider -->
    <line x1="290" y1="110" x2="290" y2="135"
          stroke="#30363D" stroke-width="1" opacity="0.5"/>
    <text x="290" y="155" text-anchor="middle" font-size="22" font-weight="bold"
          fill="#00ff66" class="attack-pulse" opacity="0.9">
      VS
    </text>
    <line x1="290" y1="165" x2="290" y2="180"
          stroke="#30363D" stroke-width="1" opacity="0.5"/>
    

    <!-- Player Section -->
    <g class="player-float">
      <image x="25" y="195" width="130" height="130" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png"
             preserveAspectRatio="xMidYMid meet"/>
    </g>
    <text x="170" y="212" font-size="18" font-weight="bold" fill="#C9D1D9">
      Bulbasaur
    </text>
    <text x="274" y="212"
          font-size="14" fill="#8B949E">
       Lv.5
    </text>
    <text x="170" y="228" font-size="11" fill="#8B949E">
      HP 2/100
    </text>
    <g>
      <rect x="210" y="215" width="13" height="11" rx="2" fill="#3B82F6" class="hp-glow"/>
      <rect x="225" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="240" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="255" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="270" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="285" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="300" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="315" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="330" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="345" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="360" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="375" y="215" width="13" height="11" rx="2" fill="#21262D"/>
