<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" width="580" height="480">
<style>
    /* === Global === */
    text { font-family: 'Segoe UI', 'SF Pro Display', -apple-system, sans-serif; }

    /* === Lightning Flash === */
    @keyframes lightningFlash {
      0%   { opacity: 0; }
      5%   { opacity: 0.9; }
      10%  { opacity: 0.1; }
      15%  { opacity: 0.85; }
      20%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .flash { animation: lightningFlash 4s ease-in-out infinite; }

    /* === HP Bar Glow === */
    @keyframes hpGlow {
      0%, 100% { filter: brightness(1) drop-shadow(0 0 2px currentColor); }
      50%      { filter: brightness(1.3) drop-shadow(0 0 6px currentColor); }
    }
    .hp-glow { animation: hpGlow 2.5s ease-in-out infinite; }

    /* === Attack Pulse === */
    @keyframes attackPulse {
      0%, 100% { opacity: 0.8; }
      50%      { opacity: 1; }
    }
    .attack-pulse { animation: attackPulse 1.8s ease-in-out infinite; }

    /* === Enemy Blink === */
    @keyframes enemyBlink {
      0%, 90%, 100% { opacity: 1; }
      95%           { opacity: 0.3; }
    }
    .enemy-blink { animation: enemyBlink 5s ease-in-out infinite; }

    /* === Player Float === */
    @keyframes playerFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    .player-float { animation: playerFloat 3s ease-in-out infinite; }

    /* === Text Flicker === */
    @keyframes textFlicker {
      0%, 100% { opacity: 1; }
      92%      { opacity: 1; }
      93%      { opacity: 0.4; }
      94%      { opacity: 1; }
      96%      { opacity: 0.6; }
      97%      { opacity: 1; }
    }
    .text-flicker { animation: textFlicker 4s ease-in-out infinite; }

    /* === Exp Bar Glow === */
    @keyframes expGlow {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }
    .exp-glow { animation: expGlow 2s ease-in-out infinite; }

    /* === Particle Float === */
    @keyframes particleFloat1 {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.3; }
      100% { transform: translate(-25px, -35px); opacity: 0; }
    }
    @keyframes particleFloat2 {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.2; }
      100% { transform: translate(30px, -28px); opacity: 0; }
    }
    @keyframes particleFloat3 {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { transform: translate(-18px, -40px); opacity: 0; }
    }
    @keyframes particleFloat4 {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.15; }
      100% { transform: translate(22px, -32px); opacity: 0; }
    }
    .p1 { animation: particleFloat1 3.0s ease-out infinite; }
    .p2 { animation: particleFloat2 3.5s ease-out 0.5s infinite; }
    .p3 { animation: particleFloat3 4.0s ease-out 1.0s infinite; }
    .p4 { animation: particleFloat4 3.2s ease-out 1.5s infinite; }
    .p5 { animation: particleFloat1 3.8s ease-out 0.8s infinite; }
    .p6 { animation: particleFloat2 3.3s ease-out 1.2s infinite; }
    </style>

    <!-- Background -->
    <rect width="580" height="480" rx="10" ry="10" fill="#0D1117"/>

    <!-- Subtle grid pattern -->
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363D" stroke-width="0.3" opacity="0.25"/>
      </pattern>
    </defs>
    <rect width="580" height="480" rx="10" ry="10" fill="url(#grid)"/>

    <!-- Top accent line -->
    <rect x="12" y="1" width="556" height="2" rx="1" fill="#00ff66" opacity="0.7"/>

    <!-- Corner accents -->
    <circle cx="16" cy="8" r="3" fill="#00ff66" opacity="0.5"/>
    <circle cx="564" cy="8" r="3" fill="#00ff66" opacity="0.5"/>
    

    <!-- Lightning Flash Effect -->
    <rect x="0" y="0" width="580" height="480" rx="10" ry="10"
          fill="#FFFF00" opacity="0" class="flash" pointer-events="none"/>
    

    <!-- Header -->
    <text x="290" y="35" text-anchor="middle"
          font-size="16" font-weight="bold" fill="#00ff66"
          class="text-flicker">
      Wild Pokemon Appeared!
    </text>
    

    <!-- Enemy Section -->
    <g class="enemy-blink">
      <image x="25" y="50" width="130" height="130" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/384.png"
             preserveAspectRatio="xMidYMid meet"/>
    </g>
    <text x="170" y="68" font-size="18" font-weight="bold" fill="#C9D1D9">
      Rayquaza
    </text>
    <text x="263" y="68"
          font-size="14" fill="#8B949E">
       Lv.68
    </text>
    <text x="170" y="82" font-size="11" fill="#8B949E">
      HP 500/500
    </text>
    <g>
      <rect x="210" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="225" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="240" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="255" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
      <rect x="270" y="63" width="13" height="11" rx="2" fill="#00ff66" class="hp-glow"/>
