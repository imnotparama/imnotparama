      <rect x="420" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="435" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="450" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="465" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="480" y="215" width="13" height="11" rx="2" fill="#21262D"/>
      <rect x="495" y="215" width="13" height="11" rx="2" fill="#21262D"/>
    </g>

    <!-- Attack -->
    <text x="170" y="265" font-size="12" fill="#8B949E">
      Last Attack:
    </text>
    <text x="170" y="282" font-size="15" font-weight="bold" fill="#00ff66" class="attack-pulse">
      Solar Beam 🌿
    </text>

    <!-- Exp Bar -->
    <text x="170" y="305" font-size="10" fill="#8B949E">
      EXP to next evolution
    </text>
    <rect x="170" y="312" width="160" height="6" rx="3" fill="#21262D"/>
    <rect x="170" y="312" width="3" height="6" rx="3"
          fill="#8B5CF6" class="exp-glow"/>
    

    <!-- Stats Section -->
    <rect x="15" y="340" width="550" height="1" fill="#30363D" opacity="0.4"/>

    <!-- Commits Today -->
    <text x="30" y="370" font-size="12" fill="#8B949E">
      Commits Today
    </text>
    <text x="30" y="392" font-size="26" font-weight="bold" fill="#00ff66">
      0
    </text>

    <!-- Total Contributions -->
    <text x="180" y="370" font-size="12" fill="#8B949E">
      Total (365d)
    </text>
    <text x="180" y="392" font-size="26" font-weight="bold" fill="#C9D1D9">
      2
    </text>

    <!-- Repos -->
    <text x="340" y="370" font-size="12" fill="#8B949E">
      Repos
    </text>
    <text x="340" y="392" font-size="26" font-weight="bold" fill="#C9D1D9">
      17
    </text>

    <!-- Username -->
    <text x="550" y="392" text-anchor="end" font-size="14" font-weight="bold"
          fill="#00ff66" opacity="0.6">
      @imnotparama
    </text>
    

    <!-- Pokeball Divider -->
    <circle cx="290" cy="415" r="8" fill="none" stroke="#8B949E" stroke-width="1.5" opacity="0.4"/>
    <line x1="282" y1="415" x2="298" y2="415" stroke="#8B949E" stroke-width="1.5" opacity="0.4"/>
    <circle cx="290" cy="415" r="2.5" fill="#8B949E" opacity="0.5"/>
    

    <!-- Footer -->
    <text x="290" y="445" text-anchor="middle" font-size="9" fill="#8B949E" opacity="0.5">
      Pokemon Battle Profile | Updated 2026-08-29 05:59 UTC
    </text>
    
<circle cx="25" cy="120" r="2.0" fill="#00ff66" opacity="0" class="p1"/>
    <circle cx="540" cy="100" r="2.5" fill="#3B82F6" opacity="0" class="p2"/>
    <circle cx="290" cy="350" r="3.0" fill="#8B5CF6" opacity="0" class="p3"/>
    <circle cx="80" cy="400" r="2.0" fill="#FFC107" opacity="0" class="p4"/>
    <circle cx="500" cy="380" r="2.5" fill="#00ff66" opacity="0" class="p5"/>
    <circle cx="200" cy="440" r="3.0" fill="#3B82F6" opacity="0" class="p6"/>
</svg>