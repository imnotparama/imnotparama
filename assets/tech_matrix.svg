<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="reactorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1724" />
      <stop offset="50%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <linearGradient id="reactorBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>

    <!-- Language Bar Gradients -->
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3572A5" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B7489" />
      <stop offset="100%" stop-color="#3178C6" />
    </linearGradient>
    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E34C26" />
      <stop offset="100%" stop-color="#F34B7D" />
    </linearGradient>
    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E38C00" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes coreRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes coreRotateRev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes energyPulse {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 6px #00F0FF); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px #00FF88); }
      }
      .rotate-ring-1 {
        transform-origin: 135px 125px;
        animation: coreRotate 12s linear infinite;
      }
      .rotate-ring-2 {
        transform-origin: 135px 125px;
        animation: coreRotateRev 8s linear infinite;
      }
      .reactor-heart {
        transform-origin: 135px 125px;
        animation: energyPulse 3s ease-in-out infinite;
      }
      .mat-title {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .mat-mono {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="236" rx="14" fill="url(#reactorBg)" stroke="url(#reactorBorder)" stroke-width="1.8" />

  <!-- Top Title Bar -->
  <rect x="2" y="2" width="896" height="30" rx="14" fill="#111A26" />
  <rect x="2" y="15" width="896" height="17" fill="#111A26" />
  <line x1="2" y1="32" x2="898" y2="32" stroke="#212A38" stroke-width="1" />
  <text x="20" y="21" class="mat-mono" font-size="11" font-weight="bold" fill="#00FF88" letter-spacing="1">⚡ SYNAPTIC ENERGY CORE // LANGUAGE &amp; RUNTIME MATRIX</text>
  <text x="880" y="21" text-anchor="end" class="mat-mono" font-size="10" fill="#8B949E">TELEMETRY: STABLE • FREQ: 5.8 GHz</text>

  <!-- ==================== LEFT: REACTOR CORE ==================== -->
  <g transform="translate(0, 5)">
    <!-- Outer Containment Vessel -->
    <circle cx="135" cy="125" r="75" fill="#070C14" stroke="#1F2937" stroke-width="2" />
    <circle cx="135" cy="125" r="70" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.4" />

    <!-- Rotating Ring 1 (Dotted) -->
    <g class="rotate-ring-1">
      <circle cx="135" cy="125" r="54" fill="none" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="12 18" opacity="0.8" />
      <circle cx="189" cy="125" r="3.5" fill="#00FF88" filter="url(#coreGlow)" />
      <circle cx="81" cy="125" r="3.5" fill="#00FF88" filter="url(#coreGlow)" />
    </g>

    <!-- Rotating Ring 2 (Counter) -->
    <g class="rotate-ring-2">
      <circle cx="135" cy="125" r="38" fill="none" stroke="#00E5FF" stroke-width="1.8" stroke-dasharray="8 14" opacity="0.9" />
      <polygon points="135,87 139,95 131,95" fill="#00E5FF" />
      <polygon points="135,163 139,155 131,155" fill="#00E5FF" />
    </g>

    <!-- Central Glowing Fusion Core -->
    <circle cx="135" cy="125" r="22" fill="#0A2533" stroke="#00FF88" stroke-width="2" class="reactor-heart" />
    <circle cx="135" cy="125" r="14" fill="#00F0FF" filter="url(#coreGlow)" />
    <circle cx="135" cy="125" r="6" fill="#FFFFFF" />

    <!-- Core Readout Text -->
    <text x="135" y="212" text-anchor="middle" class="mat-mono" font-size="9" font-weight="bold" fill="#00FF88">OUTPUT: 100% NOMINAL</text>
  </g>

  <!-- Conduit Line from Core to Bars -->
  <line x1="220" y1="130" x2="265" y2="130" stroke="#00E5FF" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="265" cy="130" r="3" fill="#00E5FF" filter="url(#coreGlow)" />

  <!-- ==================== RIGHT: 4 CORE RUNTIMES ==================== -->
  <g transform="translate(285, 48)">

    <!-- Runtime 1: Python -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" class="mat-mono" font-size="11" font-weight="bold" fill="#E6EDF3">PYTHON // AI, ML &amp; DATA SCIENCE</text>
      <rect x="420" y="2" width="160" height="18" rx="4" fill="#0C2538" stroke="#00E5FF" stroke-width="1" />
      <text x="500" y="14" text-anchor="middle" class="mat-mono" font-size="9.5" font-weight="bold" fill="#00E5FF">42% • CORE ENGINE</text>
      <!-- Bar -->
      <rect x="0" y="20" width="580" height="8" rx="4" fill="#161B22" />
      <rect x="0" y="20" width="460" height="8" rx="4" fill="url(#pythonGrad)" filter="url(#coreGlow)" />
    </g>

    <!-- Runtime 2: TypeScript & JavaScript -->
    <g transform="translate(0, 42)">
      <text x="0" y="14" class="mat-mono" font-size="11" font-weight="bold" fill="#E6EDF3">TYPESCRIPT &amp; REACT // FULL-STACK WEB</text>
      <rect x="420" y="2" width="160" height="18" rx="4" fill="#0D2136" stroke="#388BFD" stroke-width="1" />
      <text x="500" y="14" text-anchor="middle" class="mat-mono" font-size="9.5" font-weight="bold" fill="#58A6FF">28% • FLUID INTERFACES</text>
      <!-- Bar -->
      <rect x="0" y="20" width="580" height="8" rx="4" fill="#161B22" />
      <rect x="0" y="20" width="310" height="8" rx="4" fill="url(#tsGrad)" />
    </g>

    <!-- Runtime 3: C & C++ -->
    <g transform="translate(0, 84)">
      <text x="0" y="14" class="mat-mono" font-size="11" font-weight="bold" fill="#E6EDF3">C &amp; C++ // EMBEDDED IoT &amp; FIRMWARE</text>
      <rect x="420" y="2" width="160" height="18" rx="4" fill="#2E1119" stroke="#F85149" stroke-width="1" />
      <text x="500" y="14" text-anchor="middle" class="mat-mono" font-size="9.5" font-weight="bold" fill="#FFA3A8">18% • SILICON TELEMETRY</text>
      <!-- Bar -->
      <rect x="0" y="20" width="580" height="8" rx="4" fill="#161B22" />
      <rect x="0" y="20" width="200" height="8" rx="4" fill="url(#cppGrad)" />
    </g>

    <!-- Runtime 4: SQL & Database Schema -->
    <g transform="translate(0, 126)">
      <text x="0" y="14" class="mat-mono" font-size="11" font-weight="bold" fill="#E6EDF3">SQL &amp; CLOUD // POSTGRES, MYSQL, DOCKER</text>
      <rect x="420" y="2" width="160" height="18" rx="4" fill="#2D2200" stroke="#FFD700" stroke-width="1" />
      <text x="500" y="14" text-anchor="middle" class="mat-mono" font-size="9.5" font-weight="bold" fill="#FFEA00">12% • DATA INFRASTRUCTURE</text>
      <!-- Bar -->
      <rect x="0" y="20" width="580" height="8" rx="4" fill="#161B22" />
      <rect x="0" y="20" width="130" height="8" rx="4" fill="url(#sqlGrad)" />
    </g>
  </g>
</svg>
