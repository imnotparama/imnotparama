<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="100%" height="32" fill="none">
  <defs>
    <linearGradient id="dexDividerRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C60813" stop-opacity="0" />
      <stop offset="20%" stop-color="#E51B24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FF2E38" stop-opacity="1" />
      <stop offset="80%" stop-color="#E51B24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C60813" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cyanBus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0" />
    </linearGradient>
    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      @keyframes dataLaser {
        0% { transform: translateX(-200px); }
        50%, 100% { transform: translateX(950px); }
      }
      .center-gem {
        transform-origin: 450px 16px;
        animation: pulseOrb 2.5s ease-in-out infinite;
      }
      .laser-bus {
        animation: dataLaser 4.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Track Base Groove -->
  <line x1="40" y1="16" x2="860" y2="16" stroke="#30363D" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5" />
  
  <!-- Pokédex Red Main Chassis Bar -->
  <line x1="80" y1="16" x2="820" y2="16" stroke="url(#dexDividerRed)" stroke-width="2.5" />

  <!-- Animated Data Sweep -->
  <g class="laser-bus">
    <rect x="0" y="14.5" width="140" height="3" rx="1.5" fill="url(#cyanBus)" filter="url(#orbGlow)" />
  </g>

  <!-- Left Side Hardware Elements -->
  <circle cx="100" cy="16" r="4" fill="#FF1744" stroke="#8B0007" stroke-width="1" />
  <circle cx="115" cy="16" r="3" fill="#FFEA00" />
  <circle cx="128" cy="16" r="3" fill="#00E676" />
  <rect x="145" y="14" width="20" height="4" rx="2" fill="#D9DFE5" />

  <!-- Right Side Hardware Elements -->
  <rect x="735" y="14" width="20" height="4" rx="2" fill="#D9DFE5" />
  <circle cx="772" cy="16" r="3" fill="#00E676" />
  <circle cx="785" cy="16" r="3" fill="#FFEA00" />
  <circle cx="800" cy="16" r="4" fill="#FF1744" stroke="#8B0007" stroke-width="1" />

  <!-- Center Glowing Scanner Gem -->
  <circle cx="450" cy="16" r="10" fill="#1C2128" stroke="#D9DFE5" stroke-width="1.5" />
  <circle cx="450" cy="16" r="7" fill="#0080FF" class="center-gem" filter="url(#orbGlow)" />
  <circle cx="448" cy="14" r="2" fill="#FFFFFF" opacity="0.8" />
</svg>
