<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1726" />
      <stop offset="50%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    <linearGradient id="ogRedChassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E51B24" />
      <stop offset="50%" stop-color="#C60813" />
      <stop offset="100%" stop-color="#7A0006" />
    </linearGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="ogCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="ogScan" width="100" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.25" />
    </pattern>

    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .og-title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        letter-spacing: 3px;
      }
      .og-mono {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#ogScan)" pointer-events="none" />

  <!-- Outer Pokédex Hardware Bezel -->
  <path d="M 0 0 L 500 0 L 560 50 L 1200 50 L 1200 630 L 0 630 Z" fill="none" stroke="url(#ogRedChassis)" stroke-width="16" opacity="0.85" />

  <!-- Top Left Sensor Array -->
  <g transform="translate(60, 45)">
    <circle cx="45" cy="45" r="38" fill="#DCE0E6" stroke="#9AA0A6" stroke-width="2" />
    <circle cx="45" cy="45" r="30" fill="#00E5FF" filter="url(#ogGlow)" />
    <circle cx="40" cy="40" r="10" fill="#FFFFFF" opacity="0.8" />

    <!-- Mini LEDs -->
    <circle cx="120" cy="30" r="10" fill="#FF1744" filter="url(#ogGlow)" />
    <circle cx="150" cy="30" r="10" fill="#FFEA00" filter="url(#ogGlow)" />
    <circle cx="180" cy="30" r="10" fill="#00E676" filter="url(#ogGlow)" />
  </g>

  <!-- Top Right Serial Badge -->
  <rect x="940" y="24" width="200" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="1040" y="44" text-anchor="middle" class="og-mono" font-size="12" font-weight="bold" fill="#00FF88">DEX OS // v4.2 PRO</text>

  <!-- Center Card Display -->
  <g transform="translate(60, 140)">
    <!-- Header Readout -->
    <text x="0" y="25" class="og-mono" font-size="16" font-weight="bold" fill="#00FF88" letter-spacing="1">● DEX ENTRY #029 // CLASSIFIED ARCHITECT FILE</text>
    <line x1="0" y1="38" x2="1080" y2="38" stroke="#21262D" stroke-width="1.5" />

    <!-- Main Name Title -->
    <text x="0" y="110" class="og-title" font-size="64" fill="#FFFFFF" filter="url(#ogGlow)">PARAMESHWARAN S</text>
    
    <!-- Subtitle Role -->
    <text x="4" y="152" class="og-mono" font-size="20" font-weight="bold" fill="url(#ogCyan)">AI SYSTEMS ARCHITECT • DATA SCIENTIST • EMBEDDED IoT • FULL-STACK</text>

    <!-- Institution & Regional Base -->
    <text x="4" y="195" class="og-mono" font-size="16" fill="#8B949E">ACADEMY: SRM Institute of Science &amp; Technology (B.Tech ECE) • Chennai, IN 🇮🇳</text>

    <!-- 4 Tech Discipline Pills -->
    <g transform="translate(4, 230)">
      <!-- Pill 1: Neural AI -->
      <rect x="0" y="0" width="180" height="38" rx="8" fill="#1C142A" stroke="#BA68C8" stroke-width="1.5" />
      <text x="90" y="24" text-anchor="middle" class="og-mono" font-size="13" font-weight="bold" fill="#BA68C8">⚡ MULTIMODAL AI</text>

      <!-- Pill 2: Full-Stack Web -->
      <rect x="200" y="0" width="180" height="38" rx="8" fill="#0B2030" stroke="#00E5FF" stroke-width="1.5" />
      <text x="290" y="24" text-anchor="middle" class="og-mono" font-size="13" font-weight="bold" fill="#00E5FF">🌐 FULL-STACK WEB</text>

      <!-- Pill 3: Embedded Edge IoT -->
      <rect x="400" y="0" width="180" height="38" rx="8" fill="#2E1408" stroke="#FF9800" stroke-width="1.5" />
      <text x="490" y="24" text-anchor="middle" class="og-mono" font-size="13" font-weight="bold" fill="#FF9800">🔌 EMBEDDED IoT</text>

      <!-- Pill 4: Cloud & DevOps -->
      <rect x="600" y="0" width="180" height="38" rx="8" fill="#0D2416" stroke="#00E676" stroke-width="1.5" />
      <text x="690" y="24" text-anchor="middle" class="og-mono" font-size="13" font-weight="bold" fill="#00E676">☁️ CLOUD SYSTEMS</text>
    </g>

    <!-- Bottom Stat Summary & Rank -->
    <g transform="translate(4, 320)">
      <rect x="0" y="0" width="1080" height="60" rx="10" fill="#121822" stroke="#30363D" stroke-width="1.5" />
      <text x="30" y="37" class="og-mono" font-size="16" font-weight="bold" fill="url(#ogGold)">RANK: ★★★★★ CHAMPION ARCHITECT</text>
      <text x="480" y="37" class="og-mono" font-size="16" font-weight="bold" fill="#00FF88">BASE STATS: 578 / 600</text>
      <text x="800" y="37" class="og-mono" font-size="16" font-weight="bold" fill="#58A6FF">github.com/imnotparama</text>
    </g>
  </g>
</svg>
