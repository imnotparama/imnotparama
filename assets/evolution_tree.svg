<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="190" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="treeLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#00FF88" />
      <stop offset="70%" stop-color="#FFEA00" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E28" />
      <stop offset="100%" stop-color="#0B1118" />
    </linearGradient>
    <linearGradient id="megaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#0070F3" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowTree" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes beamPulse {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.6; }
        50% { stroke-dashoffset: -40; opacity: 1; }
      }
      @keyframes nodeGlow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #00FF88); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 8px #00FF88); }
      }
      @keyframes megaPulse {
        0%, 100% { stroke: #FF007F; filter: drop-shadow(0 0 4px #FF007F); }
        50% { stroke: #00E5FF; filter: drop-shadow(0 0 12px #00E5FF); }
      }
      .tree-beam {
        stroke-dasharray: 8 6;
        animation: beamPulse 3s linear infinite;
      }
      .node-card {
        transition: transform 0.3s ease;
      }
      .mega-card {
        animation: megaPulse 3s ease-in-out infinite;
      }
      .tree-title {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .tree-mono {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect width="900" height="190" rx="14" fill="#0B111A" stroke="#212A36" stroke-width="1.5" />

  <!-- Connecting Energy Conduits -->
  <!-- Main Backbone Line -->
  <line x1="120" y1="95" x2="780" y2="95" stroke="#1F2937" stroke-width="6" stroke-linecap="round" />
  <line x1="120" y1="95" x2="780" y2="95" stroke="url(#treeLineGrad)" stroke-width="2.5" class="tree-beam" filter="url(#glowTree)" />

  <!-- ==================== STAGE 1: BASE ==================== -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="url(#cardGrad1)" stroke="#00E5FF" stroke-width="1.5" />
    <!-- Level Badge -->
    <rect x="12" y="12" width="65" height="18" rx="4" fill="#003B46" stroke="#00E5FF" stroke-width="1" />
    <text x="44" y="24" text-anchor="middle" class="tree-mono" font-size="9" font-weight="bold" fill="#00E5FF">LVL. 01</text>
    <text x="168" y="24" text-anchor="end" class="tree-mono" font-size="9" fill="#8B949E">BASE</text>

    <!-- Node Icon -->
    <circle cx="90" cy="55" r="18" fill="#001F29" stroke="#00E5FF" stroke-width="1.2" />
    <text x="90" y="60" text-anchor="middle" font-size="16">🌱</text>

    <!-- Title & Sub -->
    <text x="90" y="92" text-anchor="middle" class="tree-title" font-size="12" fill="#FFFFFF">ACADEMIC BASE</text>
    <text x="90" y="108" text-anchor="middle" class="tree-mono" font-size="9.5" fill="#00E5FF">B.Tech ECE (Data Sci)</text>
    <text x="90" y="122" text-anchor="middle" class="tree-mono" font-size="8.5" fill="#8B949E">SRM Institute @ Chennai</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(212, 88)">
    <polygon points="0,0 8,7 0,14" fill="#00E5FF" filter="url(#glowTree)" />
  </g>

  <!-- ==================== STAGE 2: TIER 1 ==================== -->
  <g transform="translate(245, 25)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="url(#cardGrad1)" stroke="#00FF88" stroke-width="1.5" />
    <!-- Level Badge -->
    <rect x="12" y="12" width="65" height="18" rx="4" fill="#003D1B" stroke="#00FF88" stroke-width="1" />
    <text x="44" y="24" text-anchor="middle" class="tree-mono" font-size="9" font-weight="bold" fill="#00FF88">LVL. 32</text>
    <text x="168" y="24" text-anchor="end" class="tree-mono" font-size="9" fill="#8B949E">STAGE I</text>

    <!-- Node Icon -->
    <circle cx="90" cy="55" r="18" fill="#00240E" stroke="#00FF88" stroke-width="1.2" />
    <text x="90" y="60" text-anchor="middle" font-size="16">🌿</text>

    <!-- Title & Sub -->
    <text x="90" y="92" text-anchor="middle" class="tree-title" font-size="12" fill="#FFFFFF">FULL-STACK &amp; IoT</text>
    <text x="90" y="108" text-anchor="middle" class="tree-mono" font-size="9.5" fill="#00FF88">React • Django • ESP32</text>
    <text x="90" y="122" text-anchor="middle" class="tree-mono" font-size="8.5" fill="#8B949E">Hackathons &amp; Hardware</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(432, 88)">
    <polygon points="0,0 8,7 0,14" fill="#00FF88" filter="url(#glowTree)" />
  </g>

  <!-- ==================== STAGE 3: TIER 2 ==================== -->
  <g transform="translate(465, 25)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="url(#cardGrad1)" stroke="#FFEA00" stroke-width="1.5" />
    <!-- Level Badge -->
    <rect x="12" y="12" width="65" height="18" rx="4" fill="#3D3700" stroke="#FFEA00" stroke-width="1" />
    <text x="44" y="24" text-anchor="middle" class="tree-mono" font-size="9" font-weight="bold" fill="#FFEA00">LVL. 64</text>
    <text x="168" y="24" text-anchor="end" class="tree-mono" font-size="9" fill="#8B949E">STAGE II</text>

    <!-- Node Icon -->
    <circle cx="90" cy="55" r="18" fill="#242000" stroke="#FFEA00" stroke-width="1.2" />
    <text x="90" y="60" text-anchor="middle" font-size="16">🌳</text>

    <!-- Title & Sub -->
    <text x="90" y="92" text-anchor="middle" class="tree-title" font-size="12" fill="#FFFFFF">AI ARCHITECT</text>
    <text x="90" y="108" text-anchor="middle" class="tree-mono" font-size="9.5" fill="#FFEA00">Neural Agents &amp; Vision</text>
    <text x="90" y="122" text-anchor="middle" class="tree-mono" font-size="8.5" fill="#8B949E">Deep Learning Pipelines</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(652, 88)">
    <polygon points="0,0 8,7 0,14" fill="#FF007F" filter="url(#glowTree)" />
  </g>

  <!-- ==================== STAGE 4: MEGA APEX ==================== -->
  <g transform="translate(685, 25)">
    <rect x="0" y="0" width="190" height="140" rx="10" fill="url(#cardGrad1)" stroke-width="2" class="mega-card" />
    <!-- Level Badge -->
    <rect x="12" y="12" width="75" height="18" rx="4" fill="url(#megaGlow)" />
    <text x="49" y="24" text-anchor="middle" class="tree-mono" font-size="9" font-weight="bold" fill="#FFFFFF">MEGA ★</text>
    <text x="178" y="24" text-anchor="end" class="tree-mono" font-size="9" font-weight="bold" fill="#FF007F">APEX</text>

    <!-- Node Icon -->
    <circle cx="95" cy="55" r="18" fill="#2B0516" stroke="#FF007F" stroke-width="1.5" />
    <text x="95" y="60" text-anchor="middle" font-size="16">👑</text>

    <!-- Title & Sub -->
    <text x="95" y="92" text-anchor="middle" class="tree-title" font-size="12" fill="#FFFFFF">TIER-1 LEAD</text>
    <text x="95" y="108" text-anchor="middle" class="tree-mono" font-size="9.5" font-weight="bold" fill="#FF007F">Production AI Systems</text>
    <text x="95" y="122" text-anchor="middle" class="tree-mono" font-size="8.5" fill="#C9D1D9">Autonomous Frameworks</text>
  </g>
</svg>
