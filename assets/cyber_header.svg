<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#05080C" />
    </linearGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00FF66" stroke-width="0.5" opacity="0.07" />
    </pattern>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatText {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 2px #00FF66); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #00FF66); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0); }
        100% { transform: translateY(240px); }
      }
      @keyframes rotateHex {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes electricFlash {
        0%, 94%, 100% { opacity: 0.3; }
        95% { opacity: 1; stroke: #FFFFFF; }
        97% { opacity: 0.2; }
        98% { opacity: 0.9; stroke: #00FF66; }
      }
      .title-text {
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 4px;
        fill: #FFFFFF;
      }
      .sub-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-weight: 600;
        letter-spacing: 2.5px;
        fill: #00FF66;
      }
      .badge-text {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #C9D1D9;
        letter-spacing: 1px;
      }
      .scanline {
        animation: scanBeam 6s linear infinite;
      }
      .hud-bracket {
        animation: electricFlash 4s ease-in-out infinite;
      }
      .glow-item {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .radar {
        transform-origin: 820px 60px;
        animation: radarSweep 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="16" fill="url(#cyberGrid)" />

  <!-- Outer Neon Border Frame -->
  <rect x="10" y="10" width="880" height="220" rx="12" fill="none" stroke="#30363D" stroke-width="1.5" />
  <rect x="10" y="10" width="880" height="220" rx="12" fill="none" stroke="url(#neonGreenGrad)" stroke-width="1.5" opacity="0.4" filter="url(#neonGlow)" />

  <!-- Scanning laser line -->
  <g class="scanline">
    <rect x="10" y="0" width="880" height="2" fill="url(#laserGrad)" opacity="0.35" />
  </g>

  <!-- HUD Corner Brackets -->
  <path d="M 22 45 L 22 22 L 45 22" fill="none" stroke="#00FF66" stroke-width="3" stroke-linecap="round" class="hud-bracket" filter="url(#neonGlow)" />
  <path d="M 878 45 L 878 22 L 855 22" fill="none" stroke="#00FF66" stroke-width="3" stroke-linecap="round" class="hud-bracket" filter="url(#neonGlow)" />
  <path d="M 22 195 L 22 218 L 45 218" fill="none" stroke="#00FF66" stroke-width="3" stroke-linecap="round" class="hud-bracket" filter="url(#neonGlow)" />
  <path d="M 878 195 L 878 218 L 855 218" fill="none" stroke="#00FF66" stroke-width="3" stroke-linecap="round" class="hud-bracket" filter="url(#neonGlow)" />

  <!-- Top System Bar -->
  <rect x="40" y="24" width="8" height="8" rx="2" fill="#00FF66" class="glow-item" />
  <text x="56" y="32" class="badge-text" fill="#8B949E" font-size="10">SYS_STATUS // ONLINE • AI_CORE // ACTIVE • LATENCY // 12ms</text>
  
  <rect x="760" y="22" width="90" height="18" rx="9" fill="#161B22" stroke="#00FF66" stroke-width="1" opacity="0.8" />
  <circle cx="772" cy="31" r="3.5" fill="#00FF66" class="glow-item" />
  <text x="782" y="34" class="badge-text" font-size="9" fill="#00FF66">LEVEL 99</text>

  <!-- Animated Radar Graphic Top Right -->
  <circle cx="820" cy="60" r="18" fill="none" stroke="#00FF66" stroke-width="1" opacity="0.2" />
  <circle cx="820" cy="60" r="10" fill="none" stroke="#00FF66" stroke-width="0.8" opacity="0.3" />
  <g class="radar">
    <line x1="820" y1="60" x2="838" y2="60" stroke="#00FF66" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(60, 110)">
    <!-- Terminal prompt prefix -->
    <text x="0" y="-12" class="sub-text" font-size="14" fill="#00FF66" opacity="0.9">> CONST ARCHITECT = "PARAMESHWARAN S";</text>
    
    <!-- Big Title -->
    <text x="0" y="42" class="title-text" font-size="44" filter="url(#neonGlow)">PARAMESHWARAN S</text>
    
    <!-- Subtitle -->
    <text x="2" y="74" class="sub-text" font-size="15" fill="#00E5FF">AI ENGINEER • DATA SCIENTIST • FULL STACK DEVELOPER • IoT</text>
  </g>

  <!-- Bottom Pills / Tags -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="130" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="65" y="15" text-anchor="middle" class="badge-text" fill="#00FF66">⚡ NEURAL AGENTS</text>

    <rect x="140" y="0" width="130" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="205" y="15" text-anchor="middle" class="badge-text" fill="#00E5FF">🌐 NEXT.JS &amp; PYTHON</text>

    <rect x="280" y="0" width="130" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="345" y="15" text-anchor="middle" class="badge-text" fill="#8B5CF6">🔌 EMBEDDED IoT</text>

    <rect x="420" y="0" width="145" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="492" y="15" text-anchor="middle" class="badge-text" fill="#FFC107">🎮 POKEMON RPG BATTLE</text>
  </g>
</svg>
