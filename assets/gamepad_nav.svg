<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 68" width="100%" height="68" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gamepadBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
    <linearGradient id="btnYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEA00" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <style>
      .ctrl-btn {
        transition: transform 0.2s ease, filter 0.2s ease;
        cursor: pointer;
      }
      .ctrl-btn:hover {
        transform: translateY(-2px);
        filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.8));
      }
      .nav-mono {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- Chassis Bar Base -->
  <rect x="2" y="2" width="896" height="64" rx="12" fill="url(#gamepadBg)" stroke="#374151" stroke-width="1.5" />

  <!-- D-PAD (Left Cluster) -->
  <g transform="translate(45, 14)">
    <!-- Base Cross -->
    <rect x="14" y="0" width="12" height="40" rx="3" fill="#111827" stroke="#4B5563" stroke-width="1" />
    <rect x="0" y="14" width="40" height="12" rx="3" fill="#111827" stroke="#4B5563" stroke-width="1" />
    <circle cx="20" cy="20" r="4" fill="#0B0F17" />
    <!-- Arrows -->
    <path d="M 20 4 L 17 8 L 23 8 Z" fill="#9CA3AF" />
    <path d="M 20 36 L 17 32 L 23 32 Z" fill="#9CA3AF" />
    <path d="M 4 20 L 8 17 L 8 23 Z" fill="#9CA3AF" />
    <path d="M 36 20 L 32 17 L 32 23 Z" fill="#9CA3AF" />
    <!-- Label -->
    <text x="52" y="24" class="nav-mono" font-size="9" fill="#9CA3AF">D-PAD // QUICK NAV</text>
  </g>

  <!-- CENTER: SELECT & START BUTTONS -->
  <g transform="translate(310, 20)">
    <!-- SELECT Button -->
    <a href="https://linkedin.com/in/imnotparama" target="_blank" class="ctrl-btn">
      <rect x="0" y="8" width="55" height="12" rx="6" fill="#374151" stroke="#4B5563" stroke-width="1" transform="rotate(-22 0 8)" />
      <text x="24" y="28" text-anchor="middle" class="nav-mono" font-size="8" font-weight="bold" fill="#9CA3AF">SELECT: LINKEDIN</text>
    </a>

    <!-- START Button -->
    <a href="#executive-dossier" class="ctrl-btn">
      <rect x="130" y="8" width="55" height="12" rx="6" fill="#374151" stroke="#4B5563" stroke-width="1" transform="rotate(-22 130 8)" />
      <text x="154" y="28" text-anchor="middle" class="nav-mono" font-size="8" font-weight="bold" fill="#00FF88">START: DOSSIER</text>
    </a>
  </g>

  <!-- RIGHT: A, B, X, Y ACTION BUTTONS -->
  <g transform="translate(630, 10)">
    <!-- (X) Button: Resume -->
    <a href="https://github.com/imnotparama/imnotparama/blob/main/RESUME.md" target="_blank" class="ctrl-btn">
      <circle cx="35" cy="14" r="11" fill="url(#btnBlue)" stroke="#E0F2FE" stroke-width="1" />
      <text x="35" y="18" text-anchor="middle" class="nav-mono" font-size="10" font-weight="bold" fill="#031024">X</text>
      <text x="35" y="36" text-anchor="middle" class="nav-mono" font-size="7" fill="#BAE6FD">RESUME</text>
    </a>

    <!-- (Y) Button: Email -->
    <a href="mailto:imnotparama@gmail.com" class="ctrl-btn">
      <circle cx="95" cy="14" r="11" fill="url(#btnGreen)" stroke="#DCFCE7" stroke-width="1" />
      <text x="95" y="18" text-anchor="middle" class="nav-mono" font-size="10" font-weight="bold" fill="#052E16">Y</text>
      <text x="95" y="36" text-anchor="middle" class="nav-mono" font-size="7" fill="#BBF7D0">EMAIL</text>
    </a>

    <!-- (B) Button: Top -->
    <a href="#" class="ctrl-btn">
      <circle cx="155" cy="14" r="11" fill="url(#btnYellow)" stroke="#FEF9C3" stroke-width="1" />
      <text x="155" y="18" text-anchor="middle" class="nav-mono" font-size="10" font-weight="bold" fill="#422006">B</text>
      <text x="155" y="36" text-anchor="middle" class="nav-mono" font-size="7" fill="#FEF08A">TOP</text>
    </a>

    <!-- (A) Button: Projects -->
    <a href="#projects" class="ctrl-btn">
      <circle cx="215" cy="14" r="11" fill="url(#btnRed)" stroke="#FFE4E6" stroke-width="1" />
      <text x="215" y="18" text-anchor="middle" class="nav-mono" font-size="10" font-weight="bold" fill="#FFFFFF">A</text>
      <text x="215" y="36" text-anchor="middle" class="nav-mono" font-size="7" fill="#FECDD3">PROJECTS</text>
    </a>
  </g>
</svg>
