<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="290" fill="none">
  <defs>
    <!-- Chassis Gradients -->
    <linearGradient id="pokedexRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51B24" />
      <stop offset="50%" stop-color="#C60813" />
      <stop offset="100%" stop-color="#8B0007" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>
    <linearGradient id="blueLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#0080FF" />
      <stop offset="80%" stop-color="#0033AA" />
      <stop offset="100%" stop-color="#001155" />
    </linearGradient>
    <linearGradient id="lensReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cyanDataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.25" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="lensGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes lensPulse {
        0%, 100% { filter: drop-shadow(0 0 4px #00F0FF); opacity: 0.9; }
        50% { filter: drop-shadow(0 0 16px #00F0FF); opacity: 1; }
      }
      @keyframes ledBlinkRed {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #FF1744); }
        50% { opacity: 0.3; filter: none; }
      }
      @keyframes ledBlinkYellow {
        0%, 100% { opacity: 0.4; filter: none; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #FFEA00); }
      }
      @keyframes ledBlinkGreen {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00E676); }
        50% { opacity: 0.4; filter: none; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0); }
        100% { transform: translateY(180px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .main-lens {
        animation: lensPulse 3s ease-in-out infinite;
      }
      .led-red { animation: ledBlinkRed 1.8s ease-in-out infinite; }
      .led-yellow { animation: ledBlinkYellow 2.2s ease-in-out infinite; }
      .led-green { animation: ledBlinkGreen 1.5s ease-in-out infinite; }
      .scanner-line { animation: scanBeam 5s linear infinite; }
      .radar-sweep {
        transform-origin: 780px 145px;
        animation: radarSweep 6s linear infinite;
      }
      .dex-title {
        font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: 3px;
        fill: #FFFFFF;
      }
      .dex-mono {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- ==================== OUTER CHASSIS ==================== -->
  <!-- Main Dex Red Bezel with Iconic Top Cutout -->
  <path d="
    M 16 0 
    L 340 0 
    L 390 40 
    L 884 40 
    A 16 16 0 0 1 900 56 
    L 900 274 
    A 16 16 0 0 1 884 290 
    L 16 290 
    A 16 16 0 0 1 0 274 
    L 0 16 
    A 16 16 0 0 1 16 0 Z" 
    fill="url(#pokedexRed)" 
    stroke="#5A0005" 
    stroke-width="2" 
  />

  <!-- Top Shadow Groove -->
  <path d="M 0 40 L 340 40 L 390 80 L 900 80" fill="none" stroke="#600006" stroke-width="3" opacity="0.4" />

  <!-- ==================== HARDWARE SENSOR ARRAY (TOP LEFT) ==================== -->
  <!-- Giant Blue Scanner Lens Outer Ring -->
  <circle cx="65" cy="45" r="32" fill="#DCE0E6" stroke="#9AA0A6" stroke-width="2" />
  <circle cx="65" cy="45" r="28" fill="#1C2128" />
  <!-- Main Glowing Blue Lens -->
  <circle cx="65" cy="45" r="24" fill="url(#blueLens)" class="main-lens" filter="url(#lensGlow)" />
  <!-- Lens Reflection Highlight -->
  <ellipse cx="58" cy="38" rx="10" ry="6" fill="url(#lensReflect)" transform="rotate(-30 58 38)" />
  <circle cx="65" cy="45" r="14" fill="none" stroke="#80E0FF" stroke-width="0.8" opacity="0.6" />

  <!-- Mini Tri-Color Indicator LEDs -->
  <!-- Red LED -->
  <circle cx="125" cy="22" r="8" fill="#3D0005" stroke="#220002" stroke-width="1" />
  <circle cx="125" cy="22" r="6" fill="#FF1744" class="led-red" />
  <circle cx="123" cy="20" r="2" fill="#FFFFFF" opacity="0.7" />

  <!-- Yellow LED -->
  <circle cx="150" cy="22" r="8" fill="#3D3000" stroke="#221A00" stroke-width="1" />
  <circle cx="150" cy="22" r="6" fill="#FFEA00" class="led-yellow" />
  <circle cx="148" cy="20" r="2" fill="#FFFFFF" opacity="0.7" />

  <!-- Green LED -->
  <circle cx="175" cy="22" r="8" fill="#003D15" stroke="#00220A" stroke-width="1" />
  <circle cx="175" cy="22" r="6" fill="#00E676" class="led-green" />
  <circle cx="173" cy="20" r="2" fill="#FFFFFF" opacity="0.7" />

  <!-- Top Right Model Badge -->
  <rect x="730" y="8" width="145" height="22" rx="4" fill="#660007" stroke="#99000D" stroke-width="1" />
  <text x="802" y="23" text-anchor="middle" class="dex-mono" font-size="10" font-weight="bold" fill="#FFA3A8" letter-spacing="1.5">DEX OS // v4.2 PRO</text>

  <!-- ==================== INNER SCREEN BEZEL ==================== -->
  <!-- Metallic Grey Screen Border -->
  <rect x="25" y="88" width="850" height="184" rx="10" fill="#D9DFE5" stroke="#9DA3A8" stroke-width="1.5" />
  
  <!-- Screen Corner Screws -->
  <circle cx="36" cy="98" r="3" fill="#888F96" />
  <circle cx="864" cy="98" r="3" fill="#888F96" />
  <circle cx="36" cy="262" r="3" fill="#888F96" />
  <circle cx="864" cy="262" r="3" fill="#888F96" />

  <!-- Two Top Screen Red Dots -->
  <circle cx="435" cy="98" r="3.5" fill="#FF1744" opacity="0.8" />
  <circle cx="465" cy="98" r="3.5" fill="#FF1744" opacity="0.8" />

  <!-- OLED Screen Display Surface -->
  <rect x="45" y="108" width="810" height="144" rx="6" fill="url(#screenBg)" stroke="#001824" stroke-width="2" />
  <rect x="45" y="108" width="810" height="144" rx="6" fill="url(#scanlines)" pointer-events="none" />

  <!-- Animated Scanner Laser -->
  <g class="scanner-line" pointer-events="none">
    <line x1="45" y1="108" x2="855" y2="108" stroke="#00E5FF" stroke-width="2" opacity="0.4" filter="url(#lensGlow)" />
  </g>

  <!-- ==================== OLED SCREEN CONTENT ==================== -->
  <!-- Top Status Bar on Screen -->
  <text x="65" y="126" class="dex-mono" font-size="10" font-weight="bold" fill="#00FF88" letter-spacing="1">● DEX ENTRY #029</text>
  <text x="210" y="126" class="dex-mono" font-size="10" fill="#58A6FF">SPECIES: ARCHITECT / RESEARCHER</text>
  <text x="560" y="126" class="dex-mono" font-size="10" fill="#8B949E">REGION: CHENNAI, IN (SRMIST)</text>

  <line x1="65" y1="133" x2="835" y2="133" stroke="#00E5FF" stroke-width="1" opacity="0.3" />

  <!-- Specimen Name & Core Titles -->
  <text x="65" y="172" class="dex-title" font-size="34" filter="url(#neonTextGlow)">PARAMESHWARAN S</text>
  <text x="66" y="196" class="dex-mono" font-size="13" font-weight="bold" fill="url(#cyanDataGrad)">AI ENGINEER • DATA SCIENTIST • FULL-STACK ARCHITECT • IoT</text>

  <!-- Dex Typing Badges / Pills -->
  <g transform="translate(65, 214)">
    <!-- Type 1: NEURAL / AI -->
    <rect x="0" y="0" width="105" height="22" rx="4" fill="#9C27B0" stroke="#BA68C8" stroke-width="1" />
    <text x="52" y="15" text-anchor="middle" class="dex-mono" font-size="10" font-weight="bold" fill="#FFFFFF">⚡ NEURAL AI</text>

    <!-- Type 2: DATA SCIENCE -->
    <rect x="115" y="0" width="115" height="22" rx="4" fill="#0288D1" stroke="#29B6F6" stroke-width="1" />
    <text x="172" y="15" text-anchor="middle" class="dex-mono" font-size="10" font-weight="bold" fill="#FFFFFF">📊 DATA SCI</text>

    <!-- Type 3: FULL STACK -->
    <rect x="240" y="0" width="105" height="22" rx="4" fill="#2E7D32" stroke="#66BB6A" stroke-width="1" />
    <text x="292" y="15" text-anchor="middle" class="dex-mono" font-size="10" font-weight="bold" fill="#FFFFFF">🌐 FULL STACK</text>

    <!-- Type 4: EMBEDDED IoT -->
    <rect x="355" y="0" width="115" height="22" rx="4" fill="#E65100" stroke="#FF9800" stroke-width="1" />
    <text x="412" y="15" text-anchor="middle" class="dex-mono" font-size="10" font-weight="bold" fill="#FFFFFF">🔌 EDGE IoT</text>
  </g>

  <!-- Right Side Mini Radar / Scanner Graphic -->
  <g transform="translate(0, 20)">
    <circle cx="780" cy="145" r="28" fill="#091420" stroke="#00E5FF" stroke-width="1.2" opacity="0.6" />
    <circle cx="780" cy="145" r="18" fill="none" stroke="#00E5FF" stroke-width="0.8" opacity="0.4" />
    <circle cx="780" cy="145" r="8" fill="none" stroke="#00FF88" stroke-width="0.8" opacity="0.5" />
    <line x1="752" y1="145" x2="808" y2="145" stroke="#00E5FF" stroke-width="0.8" opacity="0.3" />
    <line x1="780" y1="117" x2="780" y2="173" stroke="#00E5FF" stroke-width="0.8" opacity="0.3" />
    <g class="radar-sweep">
      <line x1="780" y1="145" x2="808" y2="145" stroke="#00FF88" stroke-width="2" opacity="0.9" filter="url(#lensGlow)" />
    </g>
    <text x="780" y="188" text-anchor="middle" class="dex-mono" font-size="9" fill="#00FF88">RADAR: ACTIVE</text>
  </g>
</svg>
