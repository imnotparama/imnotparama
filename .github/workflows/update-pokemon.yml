# Pokemon Battle Profile & Snake SVG Generator
# ===============================================
# Runs daily at midnight UTC to regenerate the animated Pokemon battle
# interface SVG and contribution snake animation.
#
# Can also be triggered manually via workflow_dispatch.

name: Update Profile SVGs & Game Engine

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: pokemon-update
  cancel-in-progress: true

jobs:
  generate-assets:
    name: Generate Animated Profile Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Pokemon sprites
        run: python scripts/download_sprites.py

      - name: Generate Pokemon Battle SVGs
        env:
          GITHUB_USERNAME: imnotparama
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/render_full_profile.py
          python scripts/generate_pokemon_svg.py

      - name: Generate Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: imnotparama
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00ff66&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit and push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/output-assets
          [ -f profile.svg ] && cp profile.svg /tmp/output-assets/
          [ -f pokemon.svg ] && cp pokemon.svg /tmp/output-assets/
          [ -f github-contribution-grid-snake.svg ] && cp github-contribution-grid-snake.svg /tmp/output-assets/
          [ -f github-contribution-grid-snake-dark.svg ] && cp github-contribution-grid-snake-dark.svg /tmp/output-assets/

          git checkout --orphan output-workflow
          git rm -rf .

          cp /tmp/output-assets/* .
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "chore(assets): update battle & snake SVGs ($TIMESTAMP)"

          git push -f origin output-workflow:output
