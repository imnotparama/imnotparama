# Pokemon Battle Full Profile SVG Generator
# ==========================================
# Runs daily at midnight UTC to regenerate the entire profile as an
# animated Pokemon game interface SVG.
#
# Can also be triggered manually via workflow_dispatch.

name: Update Pokemon Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: pokemon-update
  cancel-in-progress: true

jobs:
  generate-svg:
    name: Generate Full Profile SVG
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Pokemon sprites
        run: python scripts/download_sprites.py

      - name: Generate full profile SVG
        env:
          GITHUB_USERNAME: imnotparama
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_full_profile.py

      - name: Commit and push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp profile.svg /tmp/profile.svg

          git checkout --orphan output-workflow
          git rm -rf .

          cp /tmp/profile.svg profile.svg
          git add profile.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "battle: update full profile SVG ($TIMESTAMP)"

          git push -f origin output-workflow:output
