# Pokemon Battle Profile & Snake SVG Generator
# ===============================================
# Runs every 6 hours to regenerate the animated Pokemon battle
# interface SVG and contribution snake animation.
#
# Can also be triggered manually via workflow_dispatch.

name: Update Profile SVGs & Game Engine

on:
  schedule:
    # Every 6 hours: keeps "Commits Today" meaningful instead of
    # reading 0 at a once-daily midnight run.
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: pokemon-update
  cancel-in-progress: true

jobs:
  generate-assets:
    name: Generate Animated Profile Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Pokemon pixel sprites
        run: python scripts/download_sprites.py

      - name: Generate Pokemon Battle SVG
        env:
          GITHUB_USERNAME: imnotparama
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_pokemon_svg.py

      - name: Generate Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: imnotparama
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00ff66&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to output branch (incremental, no-change safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/output-assets
          [ -f pokemon.svg ] && cp pokemon.svg /tmp/output-assets/
          [ -f github-contribution-grid-snake.svg ] && cp github-contribution-grid-snake.svg /tmp/output-assets/
          [ -f github-contribution-grid-snake-dark.svg ] && cp github-contribution-grid-snake-dark.svg /tmp/output-assets/

          # Remove generated files so switching branches never conflicts
          rm -f pokemon.svg github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg

          # Track the real output branch so "no changes" detection works.
          # (The old orphan-branch approach always saw a diff vs main's tree
          #  and committed daily even when nothing changed.)
          if git ls-remote --exit-code --heads origin output > /dev/null; then
            git fetch origin output --depth=1
            git checkout output
          else
            git checkout --orphan output
            git rm -rf .
          fi

          cp /tmp/output-assets/* .

          # Drop legacy pycache blobs that were accidentally committed to output
          rm -rf scripts/__pycache__ 2>/dev/null || true

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "chore(assets): update battle & snake SVGs ($TIMESTAMP)"

          git push origin output
